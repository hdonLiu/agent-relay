name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: |
          npm pack --workspace @agent-relay/server --pack-destination "$RUNNER_TEMP"
          npm pack --workspace @agent-relay/client --pack-destination "$RUNNER_TEMP"
          npm install --prefix "$RUNNER_TEMP/installed" "$RUNNER_TEMP"/agent-relay-{server,client}-*.tgz
          "$RUNNER_TEMP/installed/node_modules/.bin/agent-relay" --help
          "$RUNNER_TEMP/installed/node_modules/.bin/agent-relay-server" --help
